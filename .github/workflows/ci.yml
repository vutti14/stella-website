name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run site checks
        run: python3 scripts/ci_check.py
