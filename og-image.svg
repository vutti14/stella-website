<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0E0E0E"/>

  <!-- Top hairline -->
  <line x1="540" y1="180" x2="660" y2="180" stroke="#B8860B" stroke-width="1.5"/>

  <!-- Wordmark -->
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="140" font-weight="400" fill="#EFE8D8" letter-spacing="32">STELLA</text>

  <!-- Bottom hairline -->
  <line x1="540" y1="400" x2="660" y2="400" stroke="#B8860B" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="600" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#B8860B" letter-spacing="8">ARCHITECTURAL  GLAZING</text>

  <!-- Quote -->
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#C7BEAA">Bring quiet home.</text>
